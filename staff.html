<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff - Scout Maori</title>
    <meta name="description" content="Gestione staff Reparto Scout Maori" />
    <meta name="theme-color" content="#16a34a" />
    
    <!-- Favicon e icone -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
  <div id="app" class="max-w-4xl mx-auto w-full bg-white shadow-lg rounded-xl overflow-hidden my-1.5">
    
    <!-- Header condiviso -->
    <div id="shared-header"></div>
    
    <!-- Main -->
    <main id="main-content" class="p-6">
      <!-- Modali condivisi -->
      <div id="shared-modals"></div>
      
      <!-- Contenuto specifico Staff -->
      <section id="staffTab" class="tab-content active">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Gestione Staff</h2>
        <div class="space-y-6">
          <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Aggiungi Membro Staff</h3>
            <form id="addStaffForm" class="space-y-4">
              <div>
                <label for="staffNome" class="block text-sm font-medium text-gray-700">Nome</label>
                <input id="staffNome" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
              </div>
              <div>
                <label for="staffCognome" class="block text-sm font-medium text-gray-700">Cognome</label>
                <input id="staffCognome" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
              </div>
              <div>
                <label for="staffEmail" class="block text-sm font-medium text-gray-700">Email</label>
                <div class="contact-input-group mt-1">
                  <input id="staffEmail" type="email" required class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
                  <button type="button" class="btn-contact-action btn-contact-email" data-contact-action="email" data-for="#staffEmail" title="Invia email" aria-label="Invia email">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2z"/></svg>
                  </button>
                </div>
              </div>
              <div>
                <label for="staffRuolo" class="block text-sm font-medium text-gray-700">Ruolo</label>
                <select id="staffRuolo" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200">
                  <option value="CR">CR — Capo Reparto (Admin)</option>
                  <option value="VCR">VCR — Vice Capo Reparto (Admin)</option>
                  <option value="SiSR">SiSR — Sostituto/a in Servizio di Reparto</option>
                  <option value="RiS">RiS — Rover/Scolta in Servizio</option>
                </select>
                <p class="mt-1 text-xs text-gray-400">CR e VCR hanno accesso completo. SiSR e RiS hanno accesso limitato a Presenze, Preventivo e Gara.</p>
              </div>
              <button class="btn-primary w-full">Aggiungi Staff</button>
            </form>
          </div>

          <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Membri Staff</h3>
            <div id="staffList" class="space-y-2"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <!-- Configurazione Firebase (generata durante il build) -->
  <script src="/config.js"></script>
  <script type="module" src="shared.js"></script>
  <script type="module" src="staff.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(reg => console.log("Service Worker registrato:", reg.scope))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
</body>
</html>
