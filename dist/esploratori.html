<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esploratori - Scout Maori</title>
  <meta name="description" content="Gestione esploratori Reparto Scout Maori" />
  <meta name="theme-color" content="#16a34a" />

  <!-- Favicon e icone -->
  <link rel="icon" type="image/x-icon" href="/assets/favicon-D0S-PLtV.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192-BnNgNRfN.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512-DmSUEAR1.png" />
  <link rel="apple-touch-icon" href="/assets/icon-192-BnNgNRfN.png" />

  <!-- Manifest PWA b-->
  <link rel="manifest" href="/assets/manifest-DovV98Et.json" />

  <!-- CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
  <script type="module" crossorigin src="/assets/esploratori-DBXFQNMG.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/date-picker-CbbhrA06.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-fiqiR7An.js">
  <link rel="stylesheet" crossorigin href="/assets/presenze-BvwRKHx7.css">
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">
  <div id="app" class="max-w-4xl mx-auto w-full bg-white shadow-lg rounded-xl overflow-hidden my-1.5">

    <!-- Header condiviso -->
    <div id="shared-header"></div>

    <!-- Main -->
    <main id="main-content" class="p-6">
      <!-- Modali condivisi -->
      <div id="shared-modals"></div>

      <!-- Contenuto specifico Esploratori -->
      <section id="scoutsTab" class="tab-content active">
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Gestione Esploratori</h2>
        <div class="space-y-6">
          <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <h3 class="text-xl font-semibold text-gray-700">Aggiungi Nuovo Esploratore</h3>
              <div class="flex gap-2 flex-wrap">
                <button id="exportCsvBtn" type="button" class="btn-secondary">Esporta CSV</button>
                <button id="printSchedeBtn" type="button" class="btn-secondary" title="Stampa schede sentiero">🖨️ Stampa Schede</button>
                <button id="openAddScoutModal" type="button" class="btn-primary">+ Aggiungi</button>
              </div>
            </div>
          </div>

          <!-- Barra di navigazione alfabetica e Filtri -->
          <div id="alphaNav" class="bg-gray-50 p-4 rounded-lg shadow-inner flex flex-wrap gap-2 items-center justify-between"></div>

          <!-- Filtri e Statistiche Sanitarie -->
          <div class="bg-gray-50 p-4 rounded-lg shadow-inner flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Filtro Documenti:</span>
              <button id="filterAllScouts" type="button" class="scout-filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-green-600 text-white shadow-sm transition">
                Tutti (<span id="countAllScouts">0</span>)
              </button>
              <button id="filterNonInRegola" type="button" class="scout-filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-200 transition">
                🚨 Non in Regola (<span id="countNonInRegola">0</span>)
              </button>
              <button id="filterCertScaduti" type="button" class="scout-filter-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-600 hover:bg-gray-200 transition">
                🩺 Certificato Scaduto/In Scadenza (<span id="countCertScaduti">0</span>)
              </button>
            </div>
            <div id="medicalOverviewSummary" class="text-xs font-semibold text-gray-600"></div>
          </div>

          <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">Lista Esploratori</h3>
            <div id="scoutsList" class="space-y-2"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modale Aggiungi Esploratore -->
  <div id="addScoutModal" class="modal">
    <div class="modal-content max-w-md mx-auto">
      <h4 class="text-xl font-semibold text-gray-700">Aggiungi Esploratore</h4>
      <form id="addScoutForm" class="space-y-4 mt-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="scoutNome" class="block text-sm font-medium text-gray-700">Nome *</label>
            <input id="scoutNome" required
              class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
          </div>
          <div>
            <label for="scoutCognome" class="block text-sm font-medium text-gray-700">Cognome *</label>
            <input id="scoutCognome" required
              class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
          </div>
        </div>

        <div>
          <label for="scoutTelefono" class="block text-sm font-medium text-gray-700">Cellulare Genitore (per WhatsApp)</label>
          <div class="contact-input-group mt-1">
            <input id="scoutTelefono" type="tel" placeholder="Es. 340 1234567"
              class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
            <button type="button" class="btn-contact-action btn-contact-call" data-contact-action="call" data-for="#scoutTelefono" title="Chiama questo numero" aria-label="Chiama">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </button>
            <button type="button" class="btn-contact-action btn-contact-wa" data-contact-action="whatsapp" data-for="#scoutTelefono" title="Contatta su WhatsApp" aria-label="Contatta su WhatsApp">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 2C6.496 2 2 6.496 2 12.031c0 1.83.491 3.548 1.346 5.032L2 22l5.088-1.328a9.98 9.98 0 004.943 1.298h.004c5.535 0 10.031-4.496 10.031-10.031S17.566 2 12.031 2zm5.86 14.218c-.247.694-1.226 1.332-1.748 1.378-.49.043-1.077.067-3.486-.884-2.884-1.137-4.739-4.084-4.882-4.275-.143-.191-1.166-1.55-1.166-2.956 0-1.406.738-2.098 1.002-2.383.264-.285.576-.356.768-.356.192 0 .384.002.552.01.179.008.419-.068.654.497.247.595.84 2.052.913 2.2.072.148.12.322.024.513-.096.191-.144.31-.288.477-.144.167-.302.373-.432.502-.144.143-.294.298-.126.586.168.288.747 1.232 1.603 1.994 1.102.98 2.03 1.284 2.318 1.428.288.144.456.12.624-.072.168-.192.72-.838.912-1.126.192-.288.384-.24.648-.144.264.096 1.677.79 1.965.934.288.144.48.216.552.336.072.12.072.696-.175 1.39z"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label for="scoutCertScadenza" class="block text-sm font-medium text-gray-700">Scadenza Certificato Medico</label>
          <input id="scoutCertScadenza" type="date"
            class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200" />
        </div>

        <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2">
          <span class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Documenti Consegnati:</span>
          <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-700">
            <input type="checkbox" id="scoutDocPriv" class="w-4 h-4 rounded text-green-600 focus:ring-green-500 border-gray-300" />
            <span>Consenso Privacy firmato</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-700">
            <input type="checkbox" id="scoutDocSan" class="w-4 h-4 rounded text-green-600 focus:ring-green-500 border-gray-300" />
            <span>Scheda Sanitaria consegnata</span>
          </label>
        </div>

        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="window.UI.closeModal('addScoutModal')" class="btn-secondary">Annulla</button>
          <button type="submit" class="btn-primary">Aggiungi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PrintArea: usato per la stampa delle schede sentiero -->
  <div id="printArea" style="display:none;"></div>

  <!-- Modale Stampa Schede Sentiero -->
  <div id="printSchedeModal" class="modal">
    <div class="modal-content max-w-sm mx-auto">
      <h4 class="text-xl font-semibold text-gray-700">🖨️ Stampa Schede Sentiero</h4>
      <p class="text-sm text-gray-500 mt-1 mb-4">Seleziona quali schede stampare</p>
      <div class="space-y-3">
        <div>
          <label for="printPattugliaSelect" class="block text-sm font-medium text-gray-700 mb-1">Pattuglia</label>
          <select id="printPattugliaSelect" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-200">
            <option value="">Tutto il Reparto</option>
          </select>
        </div>
        <div class="flex gap-2 justify-end mt-4">
          <button type="button" onclick="window.UI.closeModal('printSchedeModal')" class="btn-secondary">Annulla</button>
          <button id="confirmPrintSchede" type="button" class="btn-primary">🖨️ Stampa</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Configurazione Firebase (generata durante il build) -->
  <script src="/config.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(reg => console.log("Service Worker registrato:", reg.scope))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
</body>

</html>
