<body class="bg-gray-100 flex flex-col min-h-screen">

      <!-- Modali condivisi -->
      <div id="shared-modals"></div>
      
      <!-- Contenuto specifico Documenti -->

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
