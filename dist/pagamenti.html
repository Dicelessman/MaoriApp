<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamenti - Scout Maori</title>
    <meta name="description" content="Pagamenti per attività Reparto Scout Maori" />
    <meta name="theme-color" content="#16a34a" />
    
    <!-- Favicon e icone -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon-D0S-PLtV.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192-BnNgNRfN.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512-DmSUEAR1.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192-BnNgNRfN.png" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/assets/manifest-DovV98Et.json" />
    
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
  <script type="module" crossorigin src="/assets/pagamenti-Cqq1K8nW.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/date-picker-uZF_q5LC.js">
  <link rel="modulepreload" crossorigin href="/assets/shared-axA01fcI.js">
  <link rel="stylesheet" crossorigin href="/assets/presenze-BUUTnjq0.css">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
  <div id="app" class="max-w-4xl mx-auto w-full bg-white shadow-lg rounded-xl overflow-hidden my-1.5">
    
    <!-- Header condiviso -->
    <div id="shared-header"></div>
    
    <!-- Main -->
    <main id="main-content" class="p-6">
      <!-- Modali condivisi -->
      <div id="shared-modals"></div>
      
      <!-- Contenuto specifico Pagamenti -->
      <section id="pagamentiTab" class="tab-content active">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
          <div>
            <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Pagamenti per Attività</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
              Anno scout in corso: <span id="currentYearBadge" class="font-bold text-green-700 dark:text-green-400"></span>
            </p>
          </div>
          <div class="flex items-center gap-2">
            <label for="paymentScoutYearFilter" class="text-xs font-semibold text-gray-600 dark:text-gray-300">Anno Scout:</label>
            <select id="paymentScoutYearFilter" class="text-sm font-semibold rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white px-3 py-1.5 focus:ring-2 focus:ring-green-500 focus:outline-none shadow-sm cursor-pointer">
              <!-- Popolato dinamicamente via JS con anno in corso di default -->
            </select>
          </div>
        </div>

        <!-- KPI Summary Cards per l'anno scout selezionato -->
        <div id="paymentSummaryKpis" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5"></div>

        <div id="paymentsList" class="space-y-4"></div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <!-- Configurazione Firebase (generata durante il build) -->
  <script src="/config.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(reg => console.log("Service Worker registrato:", reg.scope))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
</body>
</html>
